[project]
name = "canvas-mcp"
version = "0.1.0"
description = "Read-only Canvas LMS MCP server for a personal OpenClaw assistant"
requires-python = ">=3.11"
# pypdf>=6.4: earlier releases have known decompression-bomb DoS bugs on untrusted PDFs.
# Exact tested versions are in requirements.lock.
dependencies = ["mcp>=2.3,<3", "httpx>=0.28,<1", "pypdf>=6.4,<7", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "respx>=0.21,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
