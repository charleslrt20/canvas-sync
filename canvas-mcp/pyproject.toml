[project]
name = "canvas-mcp"
version = "0.1.0"
description = "Read-only Canvas LMS MCP server for a personal OpenClaw assistant"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "pypdf>=5.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
